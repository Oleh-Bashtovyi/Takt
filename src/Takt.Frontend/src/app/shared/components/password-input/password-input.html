<div class="flex flex-col gap-1.5">
  @if (label(); as label) {
    <label [for]="id" class="text-sm font-medium text-gray-700">{{ label }}</label>
  }
  <div class="relative">
    <input
      [id]="id"
      [class]="fieldClass"
      [formControl]="control()"
      [type]="revealed() ? 'text' : 'password'"
      [attr.autocomplete]="autocomplete()"
      [attr.aria-invalid]="invalid"
    />
    <button
      type="button"
      class="absolute right-2 top-1/2 -translate-y-1/2 rounded px-2 py-1 text-xs font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-700"
      (click)="toggleReveal()"
    >
      {{ revealed() ? 'Hide' : 'Show' }}
    </button>
  </div>
  <p class="min-h-[16px] text-xs" [class.text-red-600]="invalid" [class.text-gray-400]="!invalid">
    @if (invalid && control().errors; as errors) {
      @if (errors['required']) {
        This field is required
      } @else if (errors['minlength']) {
        Must be at least {{ errors['minlength'].requiredLength }} characters
      }
    } @else {
      {{ hint() }}
    }
  </p>
</div>
