<header class="flex h-14 items-center justify-between gap-4 border-b border-gray-200 bg-white px-6">
  <div class="flex min-w-0 items-center gap-5">
    <app-logo-group [link]="routes.tasks" />

    <nav class="flex min-w-0 items-center gap-2 text-sm">
      <span class="text-gray-300" aria-hidden="true">/</span>

      @if (onProfile()) {
        <a
          [routerLink]="routes.tasks"
          class="shrink-0 font-medium text-gray-500 hover:text-gray-900"
        >
          Tasks
        </a>
        <span class="text-gray-300" aria-hidden="true">/</span>
        <span class="font-medium text-gray-900">Profile</span>
      } @else if (categoryName(); as name) {
        <a
          [routerLink]="routes.tasks"
          class="shrink-0 font-medium text-gray-500 hover:text-gray-900"
        >
          Tasks
        </a>
        <span class="text-gray-300" aria-hidden="true">/</span>
        <span [title]="name" class="max-w-[14rem] min-w-0 truncate font-medium text-gray-900">
          {{ name }}
        </span>
      } @else {
        <span class="font-medium text-gray-900">Tasks</span>
      }
    </nav>
  </div>

  @if (user(); as user) {
    <a
      [routerLink]="routes.profile"
      class="flex shrink-0 items-center gap-2 rounded-md py-1 pr-1 pl-2 text-sm font-medium text-gray-700 hover:bg-gray-100"
    >
      {{ user.displayName || user.email }}
      <span
        class="flex h-7 w-7 items-center justify-center rounded-full bg-gray-900 text-xs font-semibold text-white"
      >
        {{ initials() }}
      </span>
    </a>
  }
</header>
