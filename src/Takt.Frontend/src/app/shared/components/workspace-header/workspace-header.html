<header class="flex h-14 items-center justify-between border-b border-gray-200 bg-white px-6">
  <app-logo-group [link]="routes.tasks" />

  @if (user(); as user) {
    <a
      [routerLink]="routes.profile"
      class="flex items-center gap-2 rounded-md py-1 pl-1 pr-2 text-sm font-medium text-gray-700 hover:bg-gray-100"
    >
      <span
        class="flex h-7 w-7 items-center justify-center rounded-full bg-gray-900 text-xs font-semibold text-white"
      >
        {{ initials() }}
      </span>
      {{ user.displayName || user.email }}
    </a>
  }
</header>
