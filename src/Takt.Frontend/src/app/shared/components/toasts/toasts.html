<!-- Toast stack: fixed top-right, newest pushes the rest down -->
<div class="pointer-events-none fixed right-4 top-4 z-50 flex w-96 flex-col-reverse gap-2.5">
  @for (toast of notifications.visible(); track toast.id) {
    @let variant = variants[toast.kind];
    <!-- Toast: icon + message + dismiss (swipe right to dismiss) -->
    <div
      class="toast pointer-events-auto flex touch-pan-y items-start gap-3 rounded-lg border p-4 shadow-sm select-none"
      [class]="variant.container"
      role="status"
      appSwipeToDismiss
      (dismissed)="notifications.dismiss(toast.id)"
    >
      <span class="mt-0.5 shrink-0" [class]="variant.iconColor">
        <app-icon [name]="variant.icon" [size]="22" />
      </span>
      <p class="flex-1 text-[0.9375rem] leading-snug">{{ toast.message }}</p>
      <button
        type="button"
        class="shrink-0 rounded p-0.5 opacity-60 transition hover:opacity-100"
        aria-label="Dismiss notification"
        (click)="notifications.dismiss(toast.id)"
      >
        <app-icon name="x" [size]="18" />
      </button>
    </div>
  }
</div>
