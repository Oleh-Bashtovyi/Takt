<form [formGroup]="form" (ngSubmit)="submit()" class="flex gap-2">
  <input
    formControlName="title"
    type="text"
    placeholder="Add a task"
    autocomplete="off"
    [attr.maxlength]="limits.titleMax"
    class="flex-1 rounded-md border border-gray-300 px-3 py-2 text-sm outline-none transition focus:ring-2 focus:ring-gray-900"
  />
  <button
    type="submit"
    [disabled]="submitting()"
    class="rounded-md bg-gray-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-gray-700 disabled:opacity-50"
  >
    Add
  </button>
</form>
