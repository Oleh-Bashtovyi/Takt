<!-- Add task form: title input + submit -->
<form [formGroup]="form" (ngSubmit)="submit()" class="flex items-center gap-2">
  <!-- Title input -->
  <input
    formControlName="title"
    type="text"
    placeholder="Add a task"
    autocomplete="off"
    [attr.maxlength]="limits.titleMax"
    class="h-10 min-w-0 flex-1 rounded-md border border-gray-300 px-3 text-sm outline-none transition focus:ring-2 focus:ring-gray-900"
  />
  <!-- Submit -->
  <button
    type="submit"
    [disabled]="submitting()"
    class="h-10 shrink-0 rounded-md bg-gray-900 px-4 text-sm font-medium text-white transition hover:bg-gray-700 disabled:opacity-50"
  >
    Add
  </button>
</form>
