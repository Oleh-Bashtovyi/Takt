<!-- Task row: whole row opens the drawer; left border colour = priority -->
<div
  class="flex cursor-pointer items-start gap-3 rounded-md border border-gray-200 border-l-4 bg-white px-4 py-3 transition hover:bg-gray-50"
  [class]="accent[task().priority]"
  role="button"
  tabindex="0"
  (click)="open.emit()"
  (keydown.enter)="open.emit()"
>
  <!-- Completion checkbox -->
  <button
    type="button"
    class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full border text-white transition"
    [class.border-gray-300]="!task().isCompleted"
    [class.hover:border-gray-500]="!task().isCompleted"
    [class.border-gray-900]="task().isCompleted"
    [class.bg-gray-900]="task().isCompleted"
    [attr.aria-pressed]="task().isCompleted"
    [attr.aria-label]="task().isCompleted ? 'Mark as not done' : 'Mark as done'"
    (click)="$event.stopPropagation(); toggleCompleted.emit(!task().isCompleted)"
  >
    @if (task().isCompleted) {
      <app-icon name="check" [size]="12" />
    }
  </button>

  <div class="min-w-0 flex-1">
    <!-- Title line: title + category chip + due date -->
    <div class="flex items-start gap-3">
      <span
        class="min-w-0 flex-1 text-sm text-gray-900"
        [class.text-gray-400]="task().isCompleted"
        [class.line-through]="task().isCompleted"
      >
        {{ task().title }}
      </span>

      <!-- Category chip (hidden when it matches the active filter) -->
      @if (showCategory()) {
        <span
          [title]="task().categoryName"
          class="mt-0.5 max-w-[8rem] shrink-0 truncate text-xs text-gray-400"
        >
          {{ task().categoryName }}
        </span>
      }

      <!-- Due date (red + icon when overdue) -->
      @if (task().dueDateUtc; as due) {
        <span
          class="mt-0.5 flex shrink-0 items-center gap-1 text-xs"
          [class.text-red-600]="overdue()"
          [class.text-gray-500]="!overdue()"
        >
          @if (overdue()) {
            <app-icon name="warning" [size]="14" />
          }
          {{ due | date: 'MMM d' }}
        </span>
      }
    </div>

    <!-- Description preview (one line) -->
    @if (task().description; as description) {
      <p class="mt-0.5 truncate text-xs text-gray-400">{{ description }}</p>
    }
  </div>
</div>
