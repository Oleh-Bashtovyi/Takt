<app-header />

<section class="mx-auto flex max-w-3xl flex-col items-center px-4 py-24 text-center">
  <h1 class="text-4xl font-bold tracking-tight text-gray-900 sm:text-5xl">
    A calmer way to track your tasks
  </h1>
  <p class="mt-6 max-w-xl text-lg text-gray-600">
    Takt keeps your to-dos simple: capture a task, sort it into a list, and check it off. Nothing
    more than you need.
  </p>
  <div class="mt-10 flex gap-4">
    @if (isAuthenticated()) {
      <a
        [routerLink]="routes.tasks"
        class="rounded-md bg-gray-900 px-5 py-2.5 text-sm font-medium text-white hover:bg-gray-700"
      >
        Go to workspace
      </a>
    } @else {
      <a
        [routerLink]="routes.register"
        class="rounded-md bg-gray-900 px-5 py-2.5 text-sm font-medium text-white hover:bg-gray-700"
      >
        Get started
      </a>
      <a
        [routerLink]="routes.login"
        class="rounded-md border border-gray-300 px-5 py-2.5 text-sm font-medium text-gray-900 hover:bg-gray-100"
      >
        Log in
      </a>
    }
  </div>
</section>
