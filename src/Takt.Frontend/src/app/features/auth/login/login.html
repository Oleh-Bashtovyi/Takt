<app-auth-card title="Welcome back" subtitle="Log in to your Takt account">
  <!-- Login form -->
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3">
    <!-- Form-level error -->
    @if (formError(); as error) {
      <p class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
    }

    <!-- Fields -->
    <app-text-input
      [control]="form.controls.email"
      label="Email"
      type="email"
      autocomplete="email"
      placeholder="you@example.com"
    />
    <app-password-input
      [control]="form.controls.password"
      label="Password"
      autocomplete="current-password"
    />
    <!-- Submit -->
    <button
      type="submit"
      [disabled]="submitting()"
      class="mt-2 w-full rounded-md bg-gray-900 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-gray-700 disabled:opacity-60"
    >
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>

  <!-- Link to register -->
  <p class="mt-6 text-center text-sm text-gray-500">
    Don't have an account?
    <a [routerLink]="routes.register" class="font-medium text-gray-900 hover:underline">Sign up</a>
  </p>
</app-auth-card>
