<app-auth-card title="Welcome back" subtitle="Log in to your Takt account">
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3">
    <app-text-input
      [control]="form.controls.email"
      label="Email"
      type="email"
      autocomplete="email"
      placeholder="you@example.com"
    />
    <app-password-input
      [control]="form.controls.password"
      label="Password"
      autocomplete="current-password"
    />
    <button
      type="submit"
      class="mt-2 w-full rounded-md bg-gray-900 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-gray-700"
    >
      Log in
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-gray-500">
    Don't have an account?
    <a [routerLink]="routes.register" class="font-medium text-gray-900 hover:underline">Sign up</a>
  </p>
</app-auth-card>
